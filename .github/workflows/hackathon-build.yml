name: Hackathon Next Build

on:
  push:
    branches:
      - main
      - hackathon/fullstack-next
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:./buildora-ci.db
      TURSO_AUTH_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck web
        run: bun --filter @buildora/web typecheck

      - name: Build web
        run: bun --filter @buildora/web build
