name: Hackathon Next Build

on:
  push:
    branches:
      - hackathon/fullstack-next
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck web
        run: bun --filter @buildora/web typecheck

      - name: Build web
        run: bun --filter @buildora/web build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buildora?schema=public
